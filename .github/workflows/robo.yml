name: Robô Rato de Promo

on:
  schedule:
    # De hora em hora, das 7h às 23h (horário de Brasília = UTC-3).
    - cron: "7 0-2,10-23 * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Modo teste (só mostra no log, não posta nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robo-rato
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Rodar o robô
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_GRUPO_ID: ${{ secrets.TELEGRAM_GRUPO_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TESTE: ${{ inputs.teste && '1' || '0' }}
        run: python -m robo.main

      - name: Guardar memória do robô
        if: ${{ !inputs.teste }}
        run: |
          git config user.name "rato-de-promo-bot"
          git config user.email "rato-de-promo-bot@users.noreply.github.com"
          git add dados/estado.json
          git diff --cached --quiet || git commit -m "memória do robô $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push --quiet || true
